pre-commit:
  parallel: true
  jobs:
    - name: scripts
      glob: "*.{js,ts,tsx}"
      stage_fixed: true
      group:
        piped: true
        jobs:
          - run: pnpm exec eslint --fix {staged_files}
          - run: pnpm exec prettier --cache --cache-location ./.prettiercache --write {staged_files}

    - name: styles
      glob: "*.css"
      stage_fixed: true
      group:
        piped: true
        jobs:
          - run: pnpm exec stylelint --cache --fix {staged_files}
          - run: pnpm exec prettier --cache --cache-location ./.prettiercache --write {staged_files}

    - name: other
      exclude: "*.{css,js,ts,tsx}"
      stage_fixed: true
      run:
        pnpm exec prettier --cache --cache-location ./.prettiercache --ignore-unknown --write
        {staged_files}
