name: Validate

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-validate"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual snapshots and upload them as `snapshots` artifact"
        type: boolean
        default: false

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-26.04

    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
      src: ${{ steps.filter.outputs.src }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The validate job runs in the playwright container image, whose tag must match the exact
      # `@playwright/test` version. `container.image` is evaluated before any step runs, so the
      # version needs to be resolved in a preceding job.
      - name: Get playwright version
        id: playwright
        run:
          echo "version=$(jq --raw-output '.devDependencies["@playwright/test"]' package.json)" >>
          "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - '!(content|public)/**'

  validate:
    name: Validate
    needs: [changes]
    if: ${{ needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    # Provides node.js, browsers and their system dependencies, and makes visual snapshots
    # reproducible locally with `pnpm run test:e2e:docker`.
    # @see https://playwright.dev/docs/ci#via-containers
    container:
      image:
        "mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright-version }}-resolute"
      options: --user 1001

    env:
      NEXT_PUBLIC_API_BASE_URL: "${{ vars.NEXT_PUBLIC_API_BASE_URL }}"
      NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_MATOMO_BASE_URL: "${{ vars.NEXT_PUBLIC_MATOMO_BASE_URL }}"
      NEXT_PUBLIC_MATOMO_ID: "${{ vars.NEXT_PUBLIC_MATOMO_ID }}"
      NEXT_PUBLIC_REDMINE_ID: "${{ vars.SERVICE_ID }}"
      NEXT_PUBLIC_TYPESENSE_COLLECTION_PREFIX: "${{ vars.NEXT_PUBLIC_TYPESENSE_COLLECTION_PREFIX }}"
      NEXT_PUBLIC_TYPESENSE_HOST: "${{ vars.NEXT_PUBLIC_TYPESENSE_HOST }}"
      NEXT_PUBLIC_TYPESENSE_PORT: "${{ vars.NEXT_PUBLIC_TYPESENSE_PORT }}"
      NEXT_PUBLIC_TYPESENSE_PROTOCOL: "${{ vars.NEXT_PUBLIC_TYPESENSE_PROTOCOL }}"
      NEXT_PUBLIC_TYPESENSE_SEARCH_API_KEY: "${{ secrets.NEXT_PUBLIC_TYPESENSE_SEARCH_API_KEY }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: "${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Styles
        run: pnpm run styles:check

      - name: Typecheck
        run: pnpm run types:check

      # https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching#github-actions
      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: "${{ github.workspace }}/.next/cache"
          key: "${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}"

      - name: Build app
        run: pnpm run build

      - name: Run e2e tests
        if: ${{ !inputs.update-snapshots }}
        run: pnpm run test:e2e

      # Used by `scripts/update-snapshots.ts`.
      - name: Update visual snapshots
        if: ${{ inputs.update-snapshots }}
        run: pnpm run test:e2e:update-snapshots

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update-snapshots }}
        with:
          name: snapshots
          path: e2e/snapshots/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build-deploy:
    name: Build and deploy
    needs: [validate]
    # @see https://github.com/orgs/community/discussions/45058
    if: ${{ github.event_name == 'push' && !failure() && !cancelled() }}
    uses: ./.github/workflows/build-deploy.yaml
    secrets: inherit
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#access-and-permissions
    permissions:
      contents: read
      packages: write
